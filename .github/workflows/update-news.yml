# 매일 오전 9:10(한국 시간)에 손경제 방송 목록과 GeekNews 소식을 받아 업데이트해요.
name: 뉴스 업데이트

on:
  schedule:
    - cron: "10 0 * * *"   # UTC 00:10 = 한국 09:10
  workflow_dispatch:        # Actions 탭에서 직접 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - name: 손경제 방송 목록 받아오기
        shell: pwsh
        run: ./update-news.ps1

      - name: GeekNews 소식 받아오기
        shell: pwsh
        run: ./update-geeknews.ps1

      - name: 바뀐 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.js geeknews-data.js
          git diff --staged --quiet || git commit -m "뉴스 업데이트 $(date +%F)"
          git push
